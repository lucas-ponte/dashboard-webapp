<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <style>
        body, html {
            margin: 0; 
            padding: 0; 
            width: 100%;
            height: 100%; 
            overflow: hidden; 
            background-color: #000000;
        }
        iframe {
            display: block; /* Força o iframe a se comportar como um bloco, removendo espaços em branco nativos */
            width: 100%; 
            height: 100%; 
            border: none;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <iframe src="https://lcs-research.streamlit.app/?embed=true" frameborder="0" marginheight="0" marginwidth="0" allowfullscreen></iframe>
</body>
</html>
