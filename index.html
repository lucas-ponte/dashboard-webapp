<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="favicon.png">
    <title>Dashboard</title>
    
    <style>
        :root {
            background-color: #000000;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden; /* Corta qualquer coisa que passar do limite da tela */
        }
        .iframe-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            display: block;
            width: 100%;
            /* A MÁGICA AQUI: Aumenta o iframe em 60px para empurrar a barra branca para fora da área visível */
            height: calc(100% + 60px); 
            border: none;
            margin: 0;
            padding: 0;
            background-color: #000000;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe src="https://SEU-APP.streamlit.app/?embed=true&theme=dark" frameborder="0" marginheight="0" marginwidth="0" allowfullscreen></iframe>
    </div>
</body>
</html>
